<!-- v48-wide2 — как v47, но на широком (> 520) две колонки и в свёрнутом: экран | чат с полем (дирижёр 29.10). Заглушки.
     v47-wide — как v46, но виджет шире 520 px: раскрыт — экран и чат в две колонки, свёрнут — экран высотой 220, не растягивается; уже 520 — как на десктопе (дирижёр 29.10). Заглушки.
     v46-dots — как v45, но «👥 2 418» и ручка — в одной строке со значком свернуть / развернуть; ручка — 6 точек 3 × 2 (дирижёр 29.10). Заглушки.
     v45-grip — как v44, но кнопка «отправить» (самолётик), пояснение не закрывается, заголовка нет, «👥 2 418» внизу; раскрыт — посередине низа ручка, тянешь — чат выше / компактнее (дирижёр 29.10). Заглушки.
     v44-seg — как v43, но поле ввода с нашей обычной рамкой (без фиолетового Twitch), выбор команды — сегментом [лого Spirit | лого Vision] (дирижёр 29.10). Заглушки.
     v43-twk — как v39, но ники цветами Kick (неон), время одно, 9 px справа, видно при наведении вместе с ♥ (дирижёр 29.10). Заглушки.
     v39-twitch — Как v35, но чат в стиле Twitch: «ник: текст», у каждого свой цвет ника, лого команды бейджем перед ником, подсветка строки при наведении, фиолетовый акцент поля (лаба widget-promo, дирижёр 29.10). Заглушки.
     v35-line — Как v34, но чат плотными строками (как Twitch): лого, ник, текст, картинка миниатюрой, ♥ мелко справа. 📎 в поле — картинка (или Ctrl+V), превью перед отправкой. Пояснение под экраном с ×, в раскрытом — «?» в шапке (лаба widget-promo, дирижёр 29.10). Заглушки.
     v33-frame — как v32, но телевизор в корпусе: общая рамка, выпуклое стекло с бликом, LED-табло вставкой с отступами, LIVE в строке иконок, ник моноширинным 12 (дирижёр 29.10). Заглушки.
     v32-static — как v31, но LED-текст стоит на месте, переносится по строкам (дирижёр 29.10: «ничего не бегущей строкой, понравился сам эффект»). Заглушки.
     v31-mix — экран-телевизор (мем фоном, развёртка, LIVE) с LED-строкой янтарём, аватар и ник; «Голосование лайками» одной строкой; раскрыт — экран тот же, ниже претенденты с ♥ и «до экрана −N» (дирижёр 29.10). Заглушки.
     v28-tv — Логика v25, подписи — иконками. Экран — кинескоп: мем фоном, полосы развёртки, виньетка, LIVE, залайканный коммент субтитром моношрифтом с мигающим курсором (лаба widget-promo, дирижёр 29.10). Заглушки.
     v25-board — Самое залайканное — большой экран, его держит трибуна, чьё сообщение набрало больше ♡ («Spirit держат экран 2:14»); ниже претендент другой трибуны и сколько ♡ не хватает, чтобы перебить; общий чат со значками (лаба widget-promo, дирижёр 29.10). Заглушки.
     v20-tribes — Две трибуны: выбрал команду — пишешь за неё, шкала «чья трибуна громче» за минуту, лучший крик каждой трибуны к моменту; раскрыт — две колонки чата. Крючок — свои против чужих (лаба widget-promo, дирижёр 29.10: «с точки зрения геймеров — как завлечь в чат»). Заглушки.
     v15-pulse — Как v12, но раскрыт — свой график: сколько комментов в минуту, пики = моменты; нажал пик — момент и лучший коммент (лаба widget-promo, дирижёр 29.10). Моменты, тексты, лайки — заглушки.
     v1-top — Квадрат первым в правой колонке, над турниром — наша графика (лаба widget-promo, созвон 28.10 §3.8). База — gs-match-2 v32.
     v30-wx — шаг 4, как v27, но виджеты правой колонки сворачиваются, как в лабе widget-expand v20: свёрнут — главное (турнир — две команды матча, замены — одной строкой), раскрыт — всё; значок справа внизу (дирижёр 29.10). MVP не сворачивается.
     v27-dr-tall — как v26, но график выше: 480 на ПК (было 380), 320 на телефоне (было 260) (дирижёр 28.10).
     v26-dr-kda — шаг 3, как v21, но KDA тремя числами цветом: убийства зелёным, смерти красным, помощь серым (дирижёр 28.10).
     v21-dr-below — шаг 3, как v20, но график выше (380), кнопки графика — маленькой группой справа сверху; под графиком пятёрки без банов: мини-иконка, позиция 1–5, ник, KDA; между ними счёт по убийствам и перевес по золоту (созвон 28.10 §2.1–2.7). Код — ../gs-match-2/_dr3.js.
     v20-btn-soft — как v19, но «назад» и «поделиться» меньше (30) и тише — без рамки, лёгкий фон, серая иконка; значки — SVG ровно по центру (дирижёр 28.10).
     v19-tabs-flush — как v18, но без отступов слева и справа: вкладки от края до края окна (дирижёр 28.10).
     v18-tabs-fill-nosep — как v14, но вкладки карт растянуты на всю ширину окна поровну, без разделителей между ними (дирижёр 28.10).
     v14-hdj-sq — как v13, но серая полоса в две строки: сверху мелко «TI 2026 · Плей-офф, день 2 из 3 · Bo3», ниже матч и счёт; «назад» и «поделиться» — квадратными кнопками по краям (дирижёр 28.10).
     v13-hd-col — как v12, но серая полоса с путём — не во всю ширину, а наверху окна в главной колонке, над вкладками карт; правая колонка начинается вровень с ним (дирижёр 28.10).
     v12-hd-win — как v10, но сверху — серая полоса с путём «турнир › стадия › матч», а вкладки карт — только в главной колонке окном браузера; график и драфт — внутри этого окна, без своих рамок (дирижёр 28.10).
     v10-hd-chrome — как v3, но как в Chrome: полоса вкладок карт, под ней «страница» со строкой пути, как адресная строка (дирижёр 28.10: «может как в браузере — вкладки, под ними путь»). Без лого турнира, «Сетки», колокольчика. Код — ../gs-match-2/_hd2.js.
     v3-live — как v2, но открывается сразу live-матч (Vision — Spirit, карта 3) и нигде нет «Записей карт» (дирижёр 28.10).
     v2-flat — как v1, но у графика одна рамка: карточка вокруг виджета графика без своей рамки (дирижёр 28.10: «убрать двойную окантовку»).
     v1-lean — как v0, но убрано по созвону 28.10 (созвон-2-матч.html): «Статистика к матчу» — только в «Превью» и до матча (§2.8); на карте нет игроков — блока «О матче» (§4.2);
     справа нет трансферов (§3.2); остров снят (§3.4) — в нижней группе ♡ / 💬 / поделиться / «Трансляция»; две колонки от 1920 убраны, шире 1920 — поля по бокам (§4.2). -->
